name: Test on Laravel 11, 12, 13 -

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "11"
            php: "8.2"
            ref: "11.x"
            coverage: false
          - laravel: "12"
            php: "8.3"
            ref: "12.x"
            coverage: true
          - laravel: "13"
            php: "8.4"
            ref: "13.x"
            coverage: false
          - laravel: "13"
            php: "8.5"
            ref: "13.x"
            coverage: false

    name: Laravel ${{ matrix.laravel }} (PHP ${{ matrix.php }})

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          path: laravel-microscope

      - name: Checkout Laravel test application
        uses: actions/checkout@v4
        with:
          repository: imanghafoori1/laravel-microscope-tester
          ref: ${{ matrix.ref }}
          path: laravel-app

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, gd, zip, curl, dom, fileinfo, libxml, bcmath, openssl, tokenizer, json, xdebug
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-l${{ matrix.laravel }}-php-${{ matrix.php }}-${{ hashFiles('laravel-app/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-l${{ matrix.laravel }}-php-${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Configure Laravel and local package
        timeout-minutes: 5
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: false
        run: |
          cd laravel-app
          composer install --no-interaction --no-progress
          composer remove imanghafoori/laravel-microscope --no-interaction 2>/dev/null || true
          composer config repositories.local-microscope '{"type": "path", "url": "../laravel-microscope", "options": {"symlink": true}}'
          composer require "imanghafoori/laravel-microscope:@dev" --no-interaction
          composer dump-autoload --no-interaction

      - name: Verify installations
        run: |
          cd laravel-app
          echo "=== Installed Versions ==="
          composer show laravel/framework  2>/dev/null || echo "laravel/framework not installed"
          composer show phpunit/phpunit    2>/dev/null || echo "phpunit/phpunit not installed"
          composer show imanghafoori/laravel-microscope 2>/dev/null || echo "Package not found"
          echo "=========================="

      - name: Prepare Laravel environment
        run: |
          cd laravel-app
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || printf 'APP_NAME=Test\nAPP_ENV=testing\nAPP_KEY=\n' > .env
          fi
          php artisan key:generate --force 2>/dev/null || true
          php artisan config:clear 2>/dev/null || true
          php artisan cache:clear  2>/dev/null || true

      - name: Run tests
        if: always()
        env:
          XDEBUG_MODE: ${{ matrix.coverage && 'coverage' || 'off' }}
        run: |
          cd laravel-app
          
          echo "running tests..."
          if [ "${{ matrix.coverage }}" = "true" ]; then
            php artisan test --coverage-clover ./../laravel-microscope/clover.xml --colors=always 2>/dev/null || false
          else
            php artisan test --colors=always 2>/dev/null || false
          fi

      - name: Check for dependency issues
        if: always()
        run: |
          cd laravel-app
          echo "=== Dependency Status ==="
          composer outdated --direct --format=json 2>/dev/null \
            | jq -r '.installed[] | "\(.name): \(.version) -> \(.latest)"' 2>/dev/null \
            || echo "Could not check dependencies"

      - name: Upload coverage results to Coveralls
        if: matrix.coverage
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd laravel-microscope
          composer global require php-coveralls/php-coveralls
          php-coveralls --coverage_clover=clover.xml --json_path=coverall.xml -v